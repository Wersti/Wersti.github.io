<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Wersti</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main class="section contact-section">
    <h2>Contact</h2>
    <form id="contactForm" action="https://formspree.io/f/xyzplbgr" method="POST" class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message..." rows="5" required></textarea>

      <!-- Honeypot anti-spam -->
      <input type="text" name="__gotcha" style="display:none" tabindex="-1" autocomplete="off" />

      <button type="submit" class="btn">Send</button>
    </form>
    <p id="successMessage" class="success-message" style="display:none;">Thanks for contacting me! I will get back to you soon.</p>
  </main>

  <script>
    const form = document.getElementById('contactForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', e => {
      e.preventDefault();

      const formData = new FormData(form);

      fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      }).then(response => {
        if (response.ok) {
          form.style.display = 'none';
          successMessage.style.display = 'block';
        } else {
          alert('Error sending message.');
        }
      }).catch(() => alert('Error sending message.'));
    });
  </script>
</body>
</html>
