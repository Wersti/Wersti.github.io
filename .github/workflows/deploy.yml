name: Deploy to GitHub Pages

on:
  push:
    branches: [main, redesign-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Use npm install (not npm ci) because npm ci skips optional platform-native
      # packages that were absent on the machine that generated the lockfile
      # (npm/cli#4828). Rolldown and Tailwind oxide ship linux-x64-gnu bindings as
      # optional deps; npm ci silently drops them on macOS-generated lockfiles,
      # causing "Cannot find native binding" at build time.
      - run: npm install

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
